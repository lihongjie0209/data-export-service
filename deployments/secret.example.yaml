apiVersion: v1
kind: Secret
metadata:
  name: data-export-service
  namespace: platform
type: Opaque
stringData:
  # Copy this file outside source control, replace every value, then apply it.
  APP_DATABASE_DSN: postgres://user:password@postgres:5432/platform?sslmode=require&search_path=data_export
  APP_MIGRATION_DATABASE_URL: postgres://user:password@postgres:5432/platform?sslmode=require&search_path=data_export
  APP_REDIS_ADDRESS: redis:6379
  APP_REDIS_PASSWORD: replace-me
  APP_JWT_SECRET: replace-with-at-least-32-random-bytes
  APP_AUTH_CLIENT_ID: replace-me
  APP_AUTH_CLIENT_SECRET: replace-me
  APP_OUTBOUND_GRPC_APPLICATION_AUTH_TOKEN: replace-with-shared-application-grant-psk
  APP_AUTH_JWKS_URL: https://identity-service.example.com/.well-known/jwks.json
  APP_AUTH_ISSUER: https://identity-service.example.com
  APP_OBJECT_STORAGE_ACCESS_KEY: replace-me
  APP_OBJECT_STORAGE_SECRET_KEY: replace-me
  APP_SERVICE_REGISTRY_PSK: replace-with-at-least-32-random-bytes
  APP_PROVIDER_CLIENT_PSK: replace-with-at-least-32-random-bytes
