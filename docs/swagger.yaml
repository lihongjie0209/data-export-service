basePath: /
definitions:
  buildinfo.Info:
    properties:
      build_time:
        type: string
      commit:
        type: string
      started_at:
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  health.Dependency:
    properties:
      latency:
        type: string
      status:
        type: string
    type: object
  health.Status:
    properties:
      dependencies:
        additionalProperties:
          $ref: '#/definitions/health.Dependency'
        type: object
      status:
        type: string
    type: object
  httptransport.CreateExportRequest:
    properties:
      application_id:
        type: string
      dataset_code:
        type: string
      filename:
        type: string
      format:
        type: string
      idempotency_key:
        type: string
      provider_service:
        type: string
      query:
        type: object
      selected_columns:
        items:
          type: string
        type: array
      tenant_id:
        type: string
    type: object
  httptransport.DescribeExportDatasetRequest:
    properties:
      application_id:
        type: string
      dataset_code:
        type: string
      provider_service:
        type: string
      tenant_id:
        type: string
    type: object
  httptransport.DownloadExportRequest:
    properties:
      application_id:
        type: string
      id:
        type: string
      tenant_id:
        type: string
      ttl_seconds:
        type: integer
    type: object
  httptransport.ExportColumnBody:
    properties:
      format:
        type: string
      key:
        type: string
      sensitive:
        type: boolean
      title:
        type: string
      type:
        type: string
    type: object
  httptransport.ExportDatasetDescriptorBody:
    properties:
      code:
        type: string
      columns:
        items:
          $ref: '#/definitions/httptransport.ExportColumnBody'
        type: array
      estimated_rows:
        type: integer
      formats:
        items:
          type: string
        type: array
      query_fields:
        items:
          $ref: '#/definitions/httptransport.ExportQueryFieldBody'
        type: array
      supports_snapshot:
        type: boolean
      title:
        type: string
    type: object
  httptransport.ExportDatasetPageBody:
    properties:
      items:
        items:
          $ref: '#/definitions/httptransport.ExportDatasetSummaryBody'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  httptransport.ExportDatasetSummaryBody:
    properties:
      code:
        type: string
      formats:
        items:
          type: string
        type: array
      healthy_instances:
        type: integer
      provider_service:
        type: string
      supports_snapshot:
        type: boolean
      title:
        type: string
    type: object
  httptransport.ExportDownloadBody:
    properties:
      checksum:
        type: string
      content_type:
        type: string
      expires_at:
        type: string
      filename:
        type: string
      url:
        type: string
    type: object
  httptransport.ExportJobBody:
    properties:
      application_id:
        type: string
      bytes_written:
        type: integer
      checksum:
        type: string
      completed_at:
        type: string
      content_type:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      dataset_code:
        type: string
      error_code:
        type: string
      error_message:
        type: string
      expires_at:
        type: string
      filename:
        type: string
      format:
        type: string
      id:
        type: string
      object_key:
        type: string
      progress_percent:
        type: integer
      provider_service:
        type: string
      query:
        type: object
      rows_exported:
        type: integer
      selected_columns:
        items:
          type: string
        type: array
      started_at:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
    type: object
  httptransport.ExportMutationBody:
    properties:
      duplicate:
        type: boolean
      job:
        $ref: '#/definitions/httptransport.ExportJobBody'
    type: object
  httptransport.ExportPageBody:
    properties:
      items:
        items:
          $ref: '#/definitions/httptransport.ExportJobBody'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  httptransport.ExportQueryFieldBody:
    properties:
      description:
        type: string
      format:
        type: string
      key:
        type: string
      options:
        items:
          type: string
        type: array
      required:
        type: boolean
      title:
        type: string
      type:
        type: string
    type: object
  httptransport.GetExportRequest:
    properties:
      application_id:
        type: string
      id:
        type: string
      tenant_id:
        type: string
    type: object
  httptransport.ListExportDatasetsRequest:
    properties:
      application_id:
        type: string
      page:
        type: integer
      page_size:
        type: integer
      search:
        type: string
      tenant_id:
        type: string
    type: object
  httptransport.ListExportsRequest:
    properties:
      application_id:
        type: string
      created_from:
        type: string
      created_to:
        type: string
      dataset_code:
        type: string
      page:
        type: integer
      page_size:
        type: integer
      status:
        type: string
      tenant_id:
        type: string
    type: object
  httptransport.MeResponseBody:
    properties:
      subject:
        type: string
    type: object
  httptransport.Response:
    properties:
      body: {}
      code:
        type: integer
      message:
        type: string
      request_id:
        type: string
    type: object
  httptransport.RetryExportRequest:
    properties:
      application_id:
        type: string
      id:
        type: string
      idempotency_key:
        type: string
      tenant_id:
        type: string
      version:
        type: integer
    type: object
  httptransport.VersionedExportRequest:
    properties:
      application_id:
        type: string
      id:
        type: string
      tenant_id:
        type: string
      version:
        type: integer
    type: object
info:
  contact: {}
  description: 'Asynchronous tenant-aware CSV, JSONL, and XLSX export API. Application
    error codes: 0 success; 10000-19999 common/input; 20000-29999 authentication/authorization;
    30000-39999 business; 50000-59999 infrastructure.'
  title: Data Export Service API
  version: "1.0"
paths:
  /api/v1/exports/cancel:
    post:
      consumes:
      - application/json
      parameters:
      - description: Job and current version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.VersionedExportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.ExportJobBody'
              type: object
      security:
      - Bearer: []
      - PSK: []
      summary: Cancel a queued or running export with optimistic locking
      tags:
      - exports
  /api/v1/exports/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Export definition
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.CreateExportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.ExportMutationBody'
              type: object
      security:
      - Bearer: []
      - PSK: []
      summary: Create an asynchronous export job
      tags:
      - exports
  /api/v1/exports/datasets/describe:
    post:
      consumes:
      - application/json
      parameters:
      - description: Dataset selector
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.DescribeExportDatasetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.ExportDatasetDescriptorBody'
              type: object
      security:
      - Bearer: []
      - PSK: []
      summary: Describe an export dataset available to an application
      tags:
      - export datasets
  /api/v1/exports/datasets/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Application scope and search
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListExportDatasetsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.ExportDatasetPageBody'
              type: object
      security:
      - Bearer: []
      - PSK: []
      summary: List export datasets available to an application
      tags:
      - export datasets
  /api/v1/exports/download:
    post:
      consumes:
      - application/json
      parameters:
      - description: Download request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.DownloadExportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.ExportDownloadBody'
              type: object
      security:
      - Bearer: []
      - PSK: []
      summary: Create a short-lived download URL
      tags:
      - exports
  /api/v1/exports/get:
    post:
      consumes:
      - application/json
      parameters:
      - description: Job selector
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.GetExportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.ExportJobBody'
              type: object
      security:
      - Bearer: []
      - PSK: []
      summary: Get an export job
      tags:
      - exports
  /api/v1/exports/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Filters and pagination
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListExportsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.ExportPageBody'
              type: object
      security:
      - Bearer: []
      - PSK: []
      summary: Search export jobs for frontend pages
      tags:
      - exports
  /api/v1/exports/retry:
    post:
      consumes:
      - application/json
      parameters:
      - description: Retry request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.RetryExportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.ExportMutationBody'
              type: object
      security:
      - Bearer: []
      - PSK: []
      summary: Retry a failed or canceled export
      tags:
      - exports
  /api/v1/me:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.MeResponseBody'
              type: object
        "401":
          description: 'Code 20001: unauthorized'
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Return the authenticated subject
      tags:
      - authentication
  /api/v1/version:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/buildinfo.Info'
              type: object
      summary: Return build and runtime version information
      tags:
      - operations
  /live:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/health.Status'
              type: object
      summary: Check process liveness
      tags:
      - operations
  /ready:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/health.Status'
              type: object
        "503":
          description: 'Code 50003: dependency unavailable'
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/health.Status'
              type: object
      summary: Check database and Redis readiness
      tags:
      - operations
schemes:
- http
- https
securityDefinitions:
  Bearer:
    description: Enter "Bearer {JWT}".
    in: header
    name: Authorization
    type: apiKey
  PSK:
    description: Enter "PSK {shared-key}" for routes configured with PSK authentication.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
